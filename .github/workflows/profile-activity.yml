name: Refresh profile activity
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-activity.mjs
      - name: Commit refreshed artwork
        run: |
          git add assets/activity.json assets/activity.svg assets/activity-mobile.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile activity'
          git push
