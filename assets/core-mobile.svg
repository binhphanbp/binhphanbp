<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title"><title id="title">Engineering mindset: thoughtful experiences, clear APIs and data models, readable code and meaningful tests.</title>
<defs>
 <linearGradient id="neon"><stop stop-color="#31d9ff"/><stop offset=".5" stop-color="#8185ff"/><stop offset="1" stop-color="#d779ff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#31d9ff" stop-opacity=".17"/><stop offset="1" stop-color="#31d9ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="violet"><stop stop-color="#9860ff" stop-opacity=".21"/><stop offset="1" stop-color="#9860ff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8caaff" stroke-opacity=".06"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="edge"><rect width="600" height="430" rx="18"/></clipPath>
</defs>
<style>
svg{font-family:'Segoe UI',Arial,sans-serif}.spin{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}.reverse{animation-direction:reverse}.float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:7 20;animation:flow 5s linear infinite}.trace{stroke-dasharray:100 1500;animation:trace 9s linear infinite}.cursor{animation:blink 1.2s steps(2,end) infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.4}}@keyframes flow{to{stroke-dashoffset:-108}}@keyframes trace{to{stroke-dashoffset:-1600}}@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.spin,.float,.pulse,.flow,.trace,.cursor{animation:none}}
</style>
<g clip-path="url(#edge)"><rect x="0" y="0" width="600" height="430" rx="18" fill="#080e20" stroke="none" /><rect x="0" y="0" width="600" height="430" rx="0" fill="url(#grid)" stroke="none" /><ellipse cx="120" cy="150.5" rx="300" ry="387" fill="url(#halo)"/><ellipse cx="480" cy="258" rx="270" ry="430" fill="url(#violet)"/><text x="30" y="42" font-size="16" fill="#6fe1ff" font-family="Consolas,Menlo,monospace" font-weight="700" letter-spacing="2">ENGINEERING MINDSET</text><text x="30" y="74" font-size="23" fill="#f0f4ff" font-weight="600">Good products connect every layer.</text><rect x="28" y="102" width="544" height="86" rx="12" fill="#0c162b" stroke="#2b3958" /><text x="46" y="134" font-size="18" fill="#43d9ff" font-family="Consolas,Menlo,monospace">01</text><text x="92" y="134" font-size="16" fill="#43d9ff" font-family="Consolas,Menlo,monospace" font-weight="700">EXPERIENCE</text><text x="92" y="159" font-size="17" fill="#dce7fa" >Thoughtful UI.</text><text x="278" y="159" font-size="16" fill="#94a9ce" >Responsive interactions.</text><rect x="28" y="202" width="544" height="86" rx="12" fill="#0c162b" stroke="#2b3958" /><text x="46" y="234" font-size="18" fill="#b495ff" font-family="Consolas,Menlo,monospace">02</text><text x="92" y="234" font-size="16" fill="#b495ff" font-family="Consolas,Menlo,monospace" font-weight="700">FOUNDATIONS</text><text x="92" y="259" font-size="17" fill="#dce7fa" >Clear APIs.</text><text x="278" y="259" font-size="16" fill="#94a9ce" >Well-shaped data models.</text><rect x="28" y="302" width="544" height="86" rx="12" fill="#0c162b" stroke="#2b3958" /><text x="46" y="334" font-size="18" fill="#67edbc" font-family="Consolas,Menlo,monospace">03</text><text x="92" y="334" font-size="16" fill="#67edbc" font-family="Consolas,Menlo,monospace" font-weight="700">CRAFT</text><text x="92" y="359" font-size="17" fill="#dce7fa" >Readable code.</text><text x="278" y="359" font-size="16" fill="#94a9ce" >Tests where they matter.</text></g>
<rect x="0.7" y="0.7" width="598.6" height="428.6" rx="18" fill="none" stroke="#293555" /><path d="M1 66V18Q1 1 18 1H192M413.99999999999994 429H582Q599 429 599 412V365" fill="none" stroke="url(#neon)" stroke-width="1.5"/></svg>
